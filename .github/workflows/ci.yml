name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Backend tests
        working-directory: backend
        run: bash ./mvnw -B verify

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend TypeScript check
        working-directory: frontend
        run: npx tsc -b --pretty false

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Build backend container
        run: docker build -t bracketwise-api:ci -f backend/Dockerfile .

      - name: Start backend container
        run: |
          docker run -d \
            --name bracketwise-api-ci \
            -p 8080:18080 \
            -e PORT=18080 \
            -e CORS_ORIGINS=https://bracketwise.example \
            bracketwise-api:ci

      - name: Verify backend container user
        run: test "$(docker inspect -f '{{.Config.User}}' bracketwise-api-ci)" = '10001:10001'

      - name: Backend HTTP smoke test
        run: node scripts/smoke-test.mjs http://127.0.0.1:8080
        env:
          SMOKE_TEST_CORS_ORIGIN: https://bracketwise.example

      - name: Start Vite proxy for integration smoke test
        working-directory: frontend
        run: |
          nohup ./node_modules/.bin/vite \
            --host 127.0.0.1 \
            --port 5173 \
            --strictPort \
            > /tmp/bracketwise-vite.log 2>&1 < /dev/null &

      - name: Frontend proxy integration smoke test (not production CORS verification)
        run: node scripts/smoke-test.mjs http://127.0.0.1:5173 --frontend

      - name: Vite logs on failure
        if: failure()
        run: |
          if [ -f /tmp/bracketwise-vite.log ]; then
            cat /tmp/bracketwise-vite.log
          else
            echo "Vite was not started; inspect the earlier failed step."
          fi

      - name: Container logs on failure
        if: failure()
        run: |
          if docker container inspect bracketwise-api-ci >/dev/null 2>&1; then
            docker logs bracketwise-api-ci
          else
            echo "Container was not created; inspect the earlier failed step."
          fi

      - name: Stop backend container
        if: always()
        run: |
          if docker container inspect bracketwise-api-ci >/dev/null 2>&1; then
            docker rm -f bracketwise-api-ci
          else
            echo "No backend container to remove."
          fi