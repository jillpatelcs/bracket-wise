services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bracketwise-backend
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bracketwise-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4173:80"
